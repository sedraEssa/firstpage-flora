<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="./assets/img/onlylogo.png" type="image/x-icon">
    <title>project1</title>
</head>
<body>
    <header>
        <!-- nav bar -->
        <nav class="navbar">
            <img src="./assets/img/navlogo.png" alt="nav-logo" class="logo">
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Service</li>
                <li>New Property</li>
                <li>Contact</li>
            </ul>
            <button class="btn">Login</button>
            <button class="menu-icon"><img src="./assets/img/menu.png" alt="menu-icon"></button>
        </nav>
        <!-- hero section  -->
        <div class="hero">
            <img src="./assets/img/modern-residential-building-transformed 1.png" alt="building" class="backgroundddd">
            <h1>Discover a place you will love to live</h1>
            <p class="description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Imperdiet tempus felis vitae sit est quisque.</p>
            <div class="info">
                <div class="cart">
                    <div class="icon">
                        <img src="./assets/img/location.png" alt="locationIcon">
                    </div>
                    <div>
                        <h2>Location</h2>
                        <p>Ahmedabad, India</p>
                    </div>
                </div>
                <div class="cart">
                    <div class="icon">
                        <img src="./assets/img/dollar-circle.png" alt="dollarIcon">
                    </div>
                    <div>
                        <h2>Price</h2>
                        <p>$1000 - $10,000</p>
                    </div>
                </div>
                <div class="cart">
                    <div class="icon">
                        <img src="./assets/img/house.png" alt="houseIcon">
                    </div>
                    <div>
                        <h2>Type of Property</h2>
                        <p>Apartment</p>
                    </div>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
